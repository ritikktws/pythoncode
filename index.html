<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>latest update</title>

  <style>
    :root {
      --bg: #0f172a;
      --card: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.15);
      --text: #e2e8f0;
      --accent: #38bdf8;
      --accent2: #6366f1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 900px;
      padding: 2rem;
      border-radius: 20px;
      background: var(--card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      animation: fadeIn 0.8s ease;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      margin-bottom: 1.5rem;
      opacity: 0.85;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 500;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(56, 189, 248, 0.4);
    }

    .card {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      margin-bottom: 10px;
    }

    .output {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #a5f3fc;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px);}
      to { opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>✨ Now this is Jenkins</h1>
    <p>This is a simple HTML + Vanilla JS test UI with a modern design.</p>

    <button class="btn" onclick="changeColor()">Change Background</button>

    <div class="card">
      <h3>Live Input</h3>
      <input type="text" id="nameInput" placeholder="Type something..." />
      <div class="output" id="outputText">Your text will appear here...</div>
    </div>

    <div class="card">
      <h3>Counter</h3>
      <button class="btn" onclick="increment()">➕ Add</button>
      <button class="btn" onclick="resetCounter()">🔄 Reset</button>
      <div class="output">Count: <span id="count">0</span></div>
    </div>
  </div>

  <script>
    // Background color changer
    function changeColor() {
      const colors = ["#0f172a", "#1e293b", "#111827", "#020617"];
      const random = colors[Math.floor(Math.random() * colors.length)];
      document.body.style.background = random;
    }

    // Live input preview
    const input = document.getElementById("nameInput");
    const output = document.getElementById("outputText");

    input.addEventListener("input", () => {
      output.textContent = input.value || "Your text will appear here...";
    });

    // Counter logic
    let count = 0;

    function increment() {
      count++;
      document.getElementById("count").textContent = count;
    }

    function resetCounter() {
      count = 0;
      document.getElementById("count").textContent = count;
    }
  </script>

</body>
</html>
